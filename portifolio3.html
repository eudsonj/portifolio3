      const Icon = memo(function Icon({ name, className = "", ...rest }) {
        const paths = ICON_PATHS[name];
        if (!paths) return null;
        return (
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            strokeWidth="2"
            strokeLinecap="round"
            strokeLinejoin="round"
            className={className}
            aria-hidden="true"
            focusable="false"
            {...rest}
          >
            {paths}
          </svg>
        );
      });

      /* ============================================================
         HOOKS
         ============================================================ */
      function useLocalStorage(key, initialValue, validator) {
        const [value, setValue] = useState(() => {
          try {
            const saved = localStorage.getItem(key);
            if (saved !== null && (!validator || validator(saved))) return saved;
          } catch (_) {}
          return initialValue;
        });

        const setAndPersist = useCallback((next) => {
          setValue(next);
          try { localStorage.setItem(key, next); } catch (_) {}
        }, [key]);

        return [value, setAndPersist];
      }

      /* ============================================================
         SMALL COMPONENTS
         ============================================================ */
      function Typewriter({ text, speed = 15, delay = 0 }) {
        const [displayed, setDisplayed] = useState("");

        useEffect(() => {
          setDisplayed("");
          let intervalId = null;
          const startId = setTimeout(() => {
            let i = 0;
            intervalId = setInterval(() => {
              i++;
              if (i <= text.length) {
                setDisplayed(text.slice(0, i));
              } else {
                clearInterval(intervalId);
                intervalId = null;
              }
            }, speed);
          }, delay);

          return () => {
            clearTimeout(startId);
            if (intervalId) clearInterval(intervalId);
          };
        }, [text, speed, delay]);

        return (
          <span className="font-mono text-sm leading-relaxed tracking-wide text-slate-300">
            {displayed}
            <span className="inline-block w-1.5 h-4 ml-1 bg-emerald-500 animate-pulse" />
          </span>
        );
      }

      const Toast = memo(function Toast({ message, onClose }) {
        const onCloseRef = useRef(onClose);
        useEffect(() => { onCloseRef.current = onClose; }, [onClose]);

        useEffect(() => {
          const id = setTimeout(() => {
            if (typeof onCloseRef.current === "function") onCloseRef.current();
          }, 3500);
          return () => clearTimeout(id);
        }, []);

        return (
          <div
            role="status"
            aria-live="polite"
            className="toast-enter fixed bottom-6 left-1/2 -translate-x-1/2 z-[100] max-w-md w-[90%] bg-[#0c0c0e] border-2 border-amber-500/40 rounded-xl px-4 py-3 shadow-2xl text-sm text-white flex items-start gap-3"
          >

            <span className="flex-1 font-sans">{message}</span>

              className="text-white/40 hover:text-white cursor-pointer"
            >
              <Icon name="x" className="w-4 h-4" />
            </button>
          </div>
        );
      });

      const CategoryButton = memo(function CategoryButton({ cat, isActive, count, onClick }) {
        return (
          <button
            onClick={onClick}
            aria-pressed={isActive}
            className={`group relative px-3.5 py-2.5 rounded-lg font-sans text-xs font-bold uppercase tracking-wider flex items-center gap-2 transition-all cursor-pointer overflow-hidden ${
              isActive
                ? "bg-white text-black shadow-md transform scale-105 z-10"
                : "bg-white/5 text-white/80 hover:text-white hover:bg-white/10 border border-white/10"
            }`}
          >
            <Icon name={cat.icon} className={`w-4 h-4 transition-transform group-hover:scale-125 ${cat.color}`} />
            <span>{cat.name}</span>
            <span className={`px-1.5 py-0.5 rounded text-[10px] font-mono font-bold transition-all ${
              isActive ? "bg-black/10 text-black" : "bg-white/15 text-white/70 group-hover:bg-white/25"
            }`}>
              {count}
            </span>
          </button>
        );
      });

      const ThemeToggle = memo(function ThemeToggle({ theme, setTheme, options }) {
        return (
          <div className="flex items-center gap-1.5 bg-black/40 p-1 rounded-full border border-white/10">
            <span className="text-[9px] font-mono text-white/50 uppercase tracking-widest pl-2">Tema:</span>
            {options.map((opt) => {
              const active = theme === opt.value;
              return (
                <button
                  key={opt.value}
                  onClick={() => setTheme(opt.value)}
                  aria-pressed={active}
                  className={`px-2.5 py-1 rounded-full text-[9px] font-sans font-bold uppercase tracking-wider transition-all cursor-pointer flex items-center gap-1 ${
                    active ? opt.activeClass : "text-white/60 hover:text-white bg-white/5"
                  }`}
                >
                  <span className={`w-1.5 h-1.5 rounded-full ${opt.dotClass}`} />
                  {opt.label}
                </button>
              );
            })}
          </div>
        );
      });

        );
      });

      const GreenArrowPanel = memo(function GreenArrowPanel({
        selectedCategory, poloTheme, generalTheme,
        arrowTargetsHit, greenArrowUnlockedSecrets, arrowStatusText, motivationalPhrase,
        onShoot, onReset, onNewPhrase,
      }) {
        const isPolo = selectedCategory === "Colégio Unidade Polo";

        const wrapClass = isPolo
          ? (poloTheme === "blue"
            ? "bg-gradient-to-br from-[#060a12] via-[#010205] to-[#03050c] border-2 border-blue-500/40 krypton-glow-blue"
            : "bg-gradient-to-br from-[#100608] via-[#050102] to-[#0c0305] border-2 border-red-500/40 krypton-glow-red")
          : (generalTheme === "blue"
            ? "bg-[#0c0c0e] border border-blue-500/20 shadow-lg shadow-blue-500/5"
            : "bg-[#0c0c0e] border border-white/10 shadow-lg");

        const boxBg = isPolo
          ? (poloTheme === "blue" ? "bg-[#03050c]/80 border-blue-500/20" : "bg-[#0c0305]/80 border-red-500/20")
          : (generalTheme === "blue" ? "bg-[#03050c]/80 border-blue-500/20" : "bg-black/40 border-white/5");

        const badgeClass = isPolo
          ? (poloTheme === "blue"
            ? "bg-blue-500/10 border-blue-500/30 text-blue-400 shadow-[0_0_10px_rgba(59,130,246,0.15)]"
            : "bg-red-500/10 border-red-500/30 text-red-400 shadow-[0_0_10px_rgba(239,68,68,0.15)]")
          : (generalTheme === "blue"
            ? "bg-blue-500/10 border-blue-500/30 text-blue-400 shadow-[0_0_10px_rgba(59,130,246,0.15)]"
            : "bg-zinc-500/10 border-zinc-500/30 text-zinc-400");

        const statusBg = isPolo
          ? (poloTheme === "blue" ? "bg-blue-950/20 border border-blue-900/30 text-blue-200/90" : "bg-red-950/20 border border-red-900/30 text-red-200/90")
          : (generalTheme === "blue" ? "bg-blue-950/20 border border-blue-900/30 text-blue-200/90" : "bg-zinc-900/50 border border-zinc-800/30 text-zinc-400");

        const secretBg = isPolo
          ? (poloTheme === "blue" ? "bg-blue-950/40 border-blue-500/50 text-blue-100" : "bg-red-950/40 border-red-500/50 text-red-100")
          : (generalTheme === "blue" ? "bg-blue-950/40 border-blue-500/50 text-blue-100" : "bg-zinc-900/60 border border-white/10 text-zinc-200");

        const targetBase = isPolo
          ? (poloTheme === "blue"
            ? "bg-[#0b0e14] border-blue-700 hover:border-blue-500 text-blue-500 hover:text-blue-300 animate-pulse"
            : "bg-[#140b0e] border-red-700 hover:border-red-500 text-red-500 hover:text-red-300 animate-pulse")
          : (generalTheme === "blue"
            ? "bg-[#0b0e14] border-blue-700 hover:border-blue-500 text-blue-500 hover:text-blue-300 animate-pulse"
            : "bg-[#141517] border-zinc-700 hover:border-zinc-500 text-zinc-500 hover:text-zinc-300");

        const targetHit = isPolo
          ? (poloTheme === "blue" ? "bg-blue-950 border-blue-500 text-blue-300 cursor-default" : "bg-red-950 border-red-500 text-red-300 cursor-default")
          : (generalTheme === "blue" ? "bg-blue-950 border-blue-500 text-blue-300 cursor-default" : "bg-zinc-800 border-zinc-500 text-zinc-200 cursor-default");

        const newPhraseClass = isPolo
          ? (poloTheme === "blue" ? "bg-blue-800 hover:bg-blue-700 border-blue-500/35 text-white" : "bg-red-800 hover:bg-red-700 border-red-500/35 text-white")
          : (generalTheme === "blue" ? "bg-blue-800 hover:bg-blue-700 border-blue-500/35 text-white" : "bg-zinc-700 hover:bg-zinc-600 border-white/10 text-zinc-100");

        return (
          <div className={`rounded-2xl p-6 text-left relative overflow-hidden transition-all duration-500 ${wrapClass}`}>
            <div className="absolute top-2 right-2 flex gap-1">
              <div className={`w-1.5 h-1.5 rounded-full animate-ping ${
                isPolo
                  ? (poloTheme === "blue" ? "bg-blue-500" : "bg-red-500")
                  : (generalTheme === "blue" ? "bg-blue-500" : "bg-zinc-500")
              }`} />
              <span className={`text-[8px] font-mono ${
                isPolo
                  ? (poloTheme === "blue" ? "text-blue-400" : "text-red-400")
                  : (generalTheme === "blue" ? "text-blue-400" : "text-zinc-500")
              }`}>
                {isPolo ? "POLO TECH LAB" : "NEUTRAL PORTFOLIO WIDGET"}
              </span>
            </div>

            <div className={`border p-4 rounded-xl mb-4 text-center mt-4 transition-all duration-500 ${boxBg}`}>
              <div className="mb-2.5">
                <span className={`text-[10px] font-mono font-bold uppercase tracking-widest px-2.5 py-1 rounded-full border ${badgeClass}`}>
                  🎮 mini game "frases motivacional"
                </span>
              </div>
              <p className={`text-[10px] font-mono mb-3 uppercase tracking-wider ${
                isPolo
                  ? (poloTheme === "blue" ? "text-blue-400" : "text-red-400")
                  : (generalTheme === "blue" ? "text-blue-400" : "text-zinc-400")
              }`}>
                {isPolo ? "MIRA DO SATÉLITE DA ESCOLA" : "MIRA DO SATÉLITE NEUTRO"}
              </p>

              <div className="flex justify-around items-center my-4 gap-2">
                {[1, 2, 3].map((num) => {
                  const isHit = arrowTargetsHit.includes(num);
                  return (
                    <button
                      key={num}
                      onClick={() => onShoot(num)}
                      aria-label={`Alvo ${num}${isHit ? " (atingido)" : ""}`}
                      className={`relative w-12 h-12 rounded-full border-4 flex items-center justify-center transition-all transform hover:scale-110 active:scale-95 cursor-pointer ${isHit ? targetHit : targetBase}`}
                    >
                      <Icon name="crosshair" className="w-6 h-6" />
                      <span className="absolute text-[8px] font-mono font-black bottom-1">{num}</span>
                      {isHit && <span className="absolute -top-1 -right-1 text-xs">🎯</span>}
                    </button>
                  );
                })}
              </div>

              <div className={`text-[11px] font-mono p-2 rounded h-10 flex items-center justify-center transition-all duration-500 ${statusBg}`}>
                {arrowStatusText}
              </div>
            </div>

            {greenArrowUnlockedSecrets && (
              <div className={`border-2 p-5 rounded-xl space-y-4 transition-all duration-500 ${secretBg}`}>
                <div className={`flex items-center gap-2 border-b pb-2 ${
                  isPolo
                    ? (poloTheme === "blue" ? "border-blue-500/30" : "border-red-500/30")
                    : (generalTheme === "blue" ? "border-blue-500/30" : "border-white/10")
                }`}>
                  <span className="text-xl">✨</span>
                  <h4 className={`font-serif text-sm font-bold uppercase tracking-wider ${
                    isPolo
                      ? (poloTheme === "blue" ? "text-blue-400" : "text-red-400")
                      : (generalTheme === "blue" ? "text-blue-400" : "text-zinc-300")
                  }`}>
                    Mensagem Motivacional Desbloqueada
                  </h4>
                </div>

                <div className={`py-3 px-4 rounded-lg italic font-serif text-sm text-center leading-relaxed shadow-inner ${
                  isPolo
                    ? (poloTheme === "blue" ? "bg-black/50 border border-blue-500/20 text-blue-200" : "bg-black/50 border border-red-500/20 text-red-200")
                    : (generalTheme === "blue" ? "bg-black/50 border border-blue-500/20 text-blue-200" : "bg-black/40 border border-white/5 text-zinc-300")
                }`}>
                  &ldquo;{motivationalPhrase}&rdquo;
                </div>

                <div className="flex gap-2">
                  <button
                    onClick={onNewPhrase}
                    className={`flex-1 py-2 font-mono text-[10px] font-bold rounded uppercase cursor-pointer transition-all flex items-center justify-center gap-1 border ${newPhraseClass}`}
                  >
                    <span>🔄 Nova Frase</span>
                  </button>
                  <button
                    onClick={onReset}
                    className="flex-1 py-2 bg-zinc-900 hover:bg-zinc-800 text-slate-400 border border-white/5 font-mono text-[10px] font-bold rounded uppercase cursor-pointer transition-all"
                  >
                    Limpar Alvos
                  </button>
                </div>
              </div>
            )}

            <div className={`mt-4 pt-3 border-t flex justify-between text-[10px] font-mono transition-all duration-500 ${
              isPolo
                ? (poloTheme === "blue" ? "border-blue-950 text-blue-500/70" : "border-red-950 text-red-500/70")
                : (generalTheme === "blue" ? "border-blue-950 text-blue-500/70" : "border-zinc-800/50 text-zinc-600")
            }`}>
              <span>DISPOSITIVO: CROSSBOW MK VII</span>
              <span>STATUS: CARREGADO</span>
            </div>
          </div>
        );
      });

      /* ============================================================
         MAIN APP
         ============================================================ */
      function App() {
        const [isUnlocked, setIsUnlocked] = useState(true);
        const [passcode, setPasscode] = useState("");
        const [loginError, setLoginError] = useState("");
        const [isActivatingKey, setIsActivatingKey] = useState(false);

        const [selectedCategory, setSelectedCategory] = useState("Colégio Unidade Polo");
        const [searchQuery, setSearchQuery] = useState("");
        const [selectedProject, setSelectedProject] = useState(PROJECTS_DATA[0]);
        const [activeSyllabus, setActiveSyllabus] = useState(null);
        const [toast, setToast] = useState(null);

        const [arrowTargetsHit, setArrowTargetsHit] = useState([]);
        const [greenArrowUnlockedSecrets, setGreenArrowUnlockedSecrets] = useState(false);
        const [arrowStatusText, setArrowStatusText] = useState("Aguardando disparo de flecha...");
        const [motivationalPhrase, setMotivationalPhrase] = useState("");

        const [poloTheme, setPoloTheme] = useLocalStorage(
          "poloTheme", "red", (v) => v === "blue" || v === "red"
        );
        const [generalTheme, setGeneralTheme] = useLocalStorage(
          "generalTheme", "blue", (v) => v === "blue" || v === "neutral"
        );

        const [readerName, setReaderName] = useState("Convidado Especial");
        const [isEditingReader, setIsEditingReader] = useState(false);

        const showToast = useCallback((msg) => setToast(msg), []);

        const currentDateFormatted = useMemo(() => {
          const today = new Date();
          const cap = (s) => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
          const weekday = cap(today.toLocaleDateString("pt-BR", { weekday: "long" }));
          const day = today.toLocaleDateString("pt-BR", { day: "2-digit" });
          const month = cap(today.toLocaleDateString("pt-BR", { month: "long" }));
          const year = today.toLocaleDateString("pt-BR", { year: "numeric" });
          return `${weekday}, ${day} de ${month} de ${year}`;
        }, []);

        const categoryCounts = useMemo(() => {
          const counts = {};
          for (const p of PROJECTS_DATA) counts[p.category] = (counts[p.category] || 0) + 1;
          counts["Todos"] = PROJECTS_DATA.length;
          counts["Colégio Unidade Polo"] = 1;
          return counts;
        }, []);

        const filteredProjects = useMemo(() => {
          const q = searchQuery.trim().toLowerCase();
          return PROJECTS_DATA.filter((proj) => {
            const matchesCat = selectedCategory === "Todos" || proj.category === selectedCategory;
            if (!matchesCat) return false;
            if (!q) return true;
            return (
              proj.title.toLowerCase().includes(q) ||
              proj.description.toLowerCase().includes(q) ||
              proj.headline.toLowerCase().includes(q)
            );
          });
        }, [selectedCategory, searchQuery]);

        const triggerUnlockSequence = useCallback(() => {
          setIsActivatingKey(true);
          setLoginError("");
          setTimeout(() => { setIsUnlocked(true); setIsActivatingKey(false); }, 1800);
        }, []);

        const handleLoginSubmit = (e) => {
          e.preventDefault();
          const clean = passcode.trim().toLowerCase();
          if (["kal-el", "clark", "smallville", "jor-el", "superman"].includes(clean)) {
            triggerUnlockSequence();
          } else {
            setLoginError("Assinatura Biométrica Inválida. Tente 'Kal-El' ou 'Smallville'.");
          }
        };

        const handleCategoryClick = useCallback((category) => {
          setSelectedCategory(category);
          const first = PROJECTS_DATA.find((p) => category === "Todos" || p.category === category);
          if (first) setSelectedProject(first);
        }, []);

        const shootTarget = useCallback((targetId) => {
          setArrowTargetsHit((prev) => prev.includes(targetId) ? prev : [...prev, targetId]);
          setGreenArrowUnlockedSecrets(true);
          setMotivationalPhrase(MOTIVATIONAL_PHRASES[Math.floor(Math.random() * MOTIVATIONAL_PHRASES.length)]);
          const labels = { 1: "🎯 Alvo 1 Atingido! Nova Mensagem Motivacional Desbloqueada!", 2: "🎯 Alvo 2 Neutralizado! Nova Mensagem Motivacional Desbloqueada!", 3: "🎯 Alvo 3 Derrubado! Nova Mensagem Motivacional Desbloqueada!" };
          setArrowStatusText(labels[targetId] || "Alvo atingido!");
        }, []);

        const resetArcheryTargets = useCallback(() => {
          setArrowTargetsHit([]);
          setGreenArrowUnlockedSecrets(false);
          setArrowStatusText("Arco tensionado. Mire nos alvos rotativos!");
        }, []);

        const refreshMotivationalPhrase = useCallback(() => {
          setMotivationalPhrase(MOTIVATIONAL_PHRASES[Math.floor(Math.random() * MOTIVATIONAL_PHRASES.length)]);
        }, []);

        const isPolo = selectedCategory === "Colégio Unidade Polo";

        return (
          <div className="min-h-screen font-sans bg-[#050508] text-[#e0e0e0] flex flex-col selection:bg-emerald-500 selection:text-black relative">
            <div className="absolute top-0 left-0 w-full h-96 bg-gradient-to-b from-cyan-950/20 to-transparent pointer-events-none z-0" />
            <div className="absolute top-1/2 right-0 w-96 h-96 bg-emerald-950/10 rounded-full blur-3xl pointer-events-none z-0" />

            {toast && <Toast message={toast} onClose={() => setToast(null)} />}

            {!isUnlocked ? (
              <div className="fixed inset-0 z-50 flex items-center justify-center p-4 crystal-bg overflow-y-auto">
                <div className="absolute inset-0 overflow-hidden pointer-events-none">
                  <div className="absolute -bottom-10 left-10 w-48 h-96 bg-cyan-500/10 skew-x-12 blur-md animate-pulse" />
                  <div className="absolute -bottom-20 right-20 w-64 h-[500px] bg-sky-500/10 -skew-x-12 blur-lg animate-pulse-slow" />
                  <div className="absolute top-10 left-1/3 w-2 h-96 bg-cyan-300/20 transform rotate-45 blur-sm" />
                  <div className="absolute top-20 right-1/4 w-4 h-[600px] bg-blue-300/15 transform -rotate-45 blur-sm" />
                </div>

                <div className="relative w-full max-w-2xl bg-[#070b14] border border-white/10 rounded-2xl p-6 md:p-10 shadow-2xl krypton-glow-blue text-center">
                  <div className="flex justify-center mb-6">
                    <div className="w-20 h-20 rounded-full border border-cyan-400/50 flex items-center justify-center bg-[#001326]">
                      <div className="w-12 h-12 rounded-full border border-dashed border-cyan-400/55 flex items-center justify-center">
                        <span className="font-serif text-2xl font-bold text-cyan-400">S</span>
                      </div>
                    </div>
                  </div>

                  <h2 className="font-serif text-3xl md:text-4xl tracking-widest text-white uppercase mb-2">
                    Fortaleza da Solidão
                  </h2>
                  <p className="text-xs text-white/50 max-w-md mx-auto mb-8 font-sans uppercase tracking-widest">
                    [ SISTEMA DE DEFESA BIOMÉTRICO KRYPTONIANO ]
                  </p>

                  <div className="bg-[#050508] border border-white/10 rounded-xl p-6 mb-8 relative overflow-hidden">
                    <div className="absolute top-2 left-2 flex gap-1">
                      <div className="w-1.5 h-1.5 rounded-full bg-cyan-400 animate-ping" />
                      <span className="text-[9px] font-mono text-cyan-400">ACTIVE DETECTOR</span>
                    </div>

                    <p className="text-xs text-slate-300 mb-4 font-sans">
                      Clique na fenda octogonal abaixo para encaixar a <strong className="text-cyan-400">Chave de Fenda Hexagonal de Clark Kent</strong> ou digite suas credenciais.
                    </p>

                    <div className="flex justify-center my-6">
                      <button
                        onClick={triggerUnlockSequence}
                        disabled={isActivatingKey}
                        aria-label="Encaixar chave octogonal"
                        className="relative w-24 h-24 fortress-crystal flex items-center justify-center shadow-lg cursor-pointer transform rotate-45 hover:scale-110 active:scale-95 transition-transform disabled:opacity-60"
                      >
                        <div className="transform -rotate-45 text-slate-900 flex flex-col items-center">
                          <Icon name="lock" className="w-6 h-6 mb-1 text-cyan-400" />
                          <span className="text-[8px] font-black tracking-wider uppercase text-cyan-400">ENCAIXAR</span>
                        </div>
                      </button>
                    </div>

                    <div className="text-[11px] font-mono text-cyan-400/80 animate-pulse">
                      {isActivatingKey ? "✨ ALINHANDO REDE DE CRISTAIS..." : "⚡ ENTRADA AUXILIAR POR CHAVE DISPONÍVEL"}
                    </div>
                  </div>

                  <form onSubmit={handleLoginSubmit} className="max-w-md mx-auto">
                    <div className="flex flex-col gap-2 mb-4">
                      <label htmlFor="passcode" className="text-left text-xs font-mono text-slate-400 uppercase tracking-wider block">
                        Assinatura de Nome Kryptoniano ou Humano:
                      </label>
                      <div className="relative">
                        <input
                          id="passcode"
                          type="text"
                          value={passcode}
                          onChange={(e) => setPasscode(e.target.value)}
                          placeholder="Ex: Kal-El ou Smallville"
                          className="w-full px-4 py-3 bg-[#081124] border border-sky-400/30 rounded-lg focus:outline-none focus:border-sky-400 text-center text-sky-200 font-mono placeholder:text-slate-600 tracking-widest text-lg uppercase"
                        />
                        <div className="absolute right-3 top-3.5 pointer-events-none">
                          <Icon name="chevron-right" className="w-5 h-5 text-sky-400/50" />
                        </div>
                      </div>
                    </div>

                    {loginError && (
                      <div role="alert" className="flex items-center gap-2 justify-center p-3 mb-4 rounded-lg bg-red-950/40 border border-red-500/40 text-red-300 text-xs text-left animate-pulse">
                        <Icon name="shield-alert" className="w-4 h-4 shrink-0" />
                        <span>{loginError}</span>
                      </div>
                    )}

                    <div className="flex items-center justify-between text-xs font-mono text-slate-400 pt-2 border-t border-slate-800/60">
                      <span>BIOMETRIA: CLARKKENT@DAILYPLANET.COM</span>
                      <span className="text-sky-400">Jor-El 1.0_PRO</span>
                    </div>

                    <button
                      type="submit"
                      disabled={isActivatingKey}
                      className="w-full mt-6 py-3 px-6 bg-gradient-to-r from-sky-600 to-sky-800 hover:from-sky-500 hover:to-sky-700 text-white font-mono rounded-lg transition-all shadow-md flex items-center justify-center gap-2 cursor-pointer border border-sky-400/40 uppercase tracking-widest text-sm disabled:opacity-60"
                    >
                      <Icon name="compass" className="w-4 h-4 animate-spin" />
                      {isActivatingKey ? "Decodificando..." : "Materializar Acesso"}
                    </button>
                  </form>
                </div>
              </div>
            ) : (
              <div className="flex-1 flex flex-col z-10">
                <header className="border-b-4 border-white/20 bg-[#0a0a0c] pt-8 pb-4 px-4 md:px-8 relative">
                  <div className="max-w-7xl mx-auto">
                    <div className="flex flex-col md:flex-row justify-between items-center text-xs font-sans tracking-widest text-white/50 border-b border-white/10 pb-3 mb-4 gap-2 uppercase">
                      <div className="flex items-center gap-4">
                        <span className="px-2 py-0.5 bg-red-700 text-white font-bold rounded uppercase text-[10px]">EDIÇÃO EXTRA ESPECIAL</span>
                      </div>
                      <div className="flex items-center gap-4">
                        <span className="text-white/70">{currentDateFormatted}</span>
                      </div>
                    </div>

                    <div className="text-center my-6 relative">
                      <div className="inline-block relative">
                        <h1 className="font-serif text-5xl md:text-7xl lg:text-8xl font-black tracking-tighter text-white uppercase daily-planet-border px-6 py-2 border-white/20 inline-block">
                          PLANETA DIÁRIO
                        </h1>
                        <span className="absolute -bottom-3 right-4 bg-[#0a0a0c] px-3 text-xs font-sans tracking-[0.3em] font-bold text-amber-500">
                          O (JORNAL) DE EUDSON
                        </span>
                      </div>
                    </div>

                    <div className="border-t border-b border-white/10 py-3 my-4 flex flex-col sm:flex-row justify-between items-center text-xs text-white/60 gap-2">
                      <div className="flex items-center gap-2">
                        <span className="font-sans text-amber-500 font-bold uppercase tracking-wider">LEITOR ASSOCIADO:</span>
                        {isEditingReader ? (
                          <div className="flex items-center gap-1">
                            <input
                              type="text"
                              value={readerName}
                              onChange={(e) => setReaderName(e.target.value)}
                              onBlur={() => setIsEditingReader(false)}
                              onKeyDown={(e) => e.key === "Enter" && setIsEditingReader(false)}
                              className="bg-white/5 border border-white/10 px-2 py-0.5 rounded text-white focus:outline-none"
                              autoFocus
                              aria-label="Nome do leitor"
                            />
                            <button onClick={() => setIsEditingReader(false)} className="px-2 py-0.5 bg-emerald-800 text-white rounded cursor-pointer font-sans">
                              Salvar
                            </button>
                          </div>
                        ) : (
                          <div className="flex items-center gap-2">
                            <span className="text-white font-bold font-sans">{readerName}</span>
                            <button onClick={() => setIsEditingReader(true)} className="text-[10px] text-cyan-400 hover:underline cursor-pointer font-mono">
                              [Alterar Nome]
                            </button>
                          </div>
                        )}
                      </div>
                    </div>

                    <div className="relative mt-6 mb-2">
                      <div className="text-center mb-3">
                        <p className="text-[11px] font-sans uppercase tracking-widest text-white/50 flex items-center justify-center gap-2">
                          <span className="w-1.5 h-1.5 rounded-full bg-amber-500 animate-pulse" />
                          Filtrar Projetos por Categoria
                        </p>
                      </div>
                      <div className="flex flex-wrap justify-center gap-2 p-3 bg-black/80 rounded-xl border border-white/10 shadow-inner relative overflow-hidden">
                        {CATEGORIES.map((cat) => (
                          <CategoryButton
                            key={cat.name}
                            cat={cat}
                            isActive={selectedCategory === cat.name}
                            count={categoryCounts[cat.name] || 0}
                            onClick={() => handleCategoryClick(cat.name)}
                          />
                        ))}
                      </div>
                    </div>
                  </div>
                </header>

                <main id="main-content" className="flex-1 max-w-7xl mx-auto w-full p-4 md:p-8 grid grid-cols-1 lg:grid-cols-12 gap-8">
                  <section className="lg:col-span-8 flex flex-col gap-8">
                    <div className="border-b-2 border-white/10 pb-3 flex flex-col md:flex-row justify-between items-start md:items-end gap-4">
                      <div>
                        <p className="text-[10px] font-sans text-amber-500 uppercase tracking-widest">Categoria Selecionada</p>
                        <h3 className="font-serif text-3xl font-black text-white uppercase">
                          Seção: {selectedCategory}
                        </h3>
                      </div>
                      <div className="flex flex-wrap items-center gap-3 w-full md:w-auto justify-start md:justify-end">
                        {isPolo ? (
                          <ThemeToggle
                            theme={poloTheme}
                            setTheme={setPoloTheme}
